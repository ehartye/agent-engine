# Lint and release checks for the skills. No dependencies: Node only.
# The older skills (engine-selection, engine-asset-import, engine-phaser, engine-custom-shaders) do not pass the
# evidence-label rules yet; they are backlog, so only the web 3D skills are linted here.
name: lint-skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.11'
      - name: Lint and release-consistency tests
        run: node --test scripts/lint-skills.test.mjs scripts/release-consistency.test.mjs tests/phaser-audio-decode.test.mjs tests/phaser-gamepad-lifecycle.test.mjs examples/web/harness/tests/no-sleeps.test.mjs tests/phaser-framebuffer-restore.test.mjs tests/phaser-audio-visibility.test.mjs
      - name: Strict lint of the web 3D skills
        run: node scripts/lint-skills.mjs skills/engine-r3f skills/engine-babylon --require-claims --skill-md-labels
